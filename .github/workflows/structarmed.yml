name: "StructArmed"

on:
  pull_request:
  push:
    branches:
    tags:

env:
  default_php: '8.3'
  php_extensions: gd,intl,mbstring,json

jobs:
  rector:
    name: StructArmed on Default PHP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: shivammathur/setup-php@2.40.0
        with:
            php-version: ${{ env.default_php }}
            extensions: ${{ env.php_extensions }}
            tools: composer
            coverage: none
      - uses: ramsey/composer-install@4.0.0
      - uses: ramsey/composer-install@4.0.0
        with:
            working-directory: tools/structarmed
      - run: tools/structarmed/vendor/bin/structarmed --config tools/structarmed/structarmed.php analyze
